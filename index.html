<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>천사데이 D-day 영상</title>
<meta name="description" content="제14회 천사데이 찬스바자회 홍보 영상 — 오늘 날짜의 D-day 영상을 골라 받으세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* layout: phone-sized preview, then three rows of choices and one download button; stacks to one column on phones */
:root {
  --bg: #FFF6EE; --surface: #FFFFFF; --fg: #2B1A10; --muted: #74604F; --line: #F0D9C6; --accent: #B8430A; --accent-ink: #FFFFFF; --sun: #FFB347;
  --display: "Black Han Sans", "Apple SD Gothic Neo", sans-serif; --body: "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root { --bg: #1C130D; --surface: #2A1D14; --fg: #FBEFE4; --muted: #C4AE9B; --line: #4A3526; --accent: #FF7A33; --accent-ink: #1C130D; color-scheme: dark } }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 var(--body); word-break: keep-all; padding: max(20px, env(safe-area-inset-top)) 16px max(40px, env(safe-area-inset-bottom)) }
.wrap { max-width: 960px; margin: 0 auto; display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: start }
@media (max-width: 760px) { .wrap { grid-template-columns: 1fr; gap: 18px } }
h1 { font: 30px/1.15 var(--display); margin: 0 0 4px; text-wrap: balance }
.sub { color: var(--muted); margin: 0 0 18px; font-size: 14px }
.prev { width: var(--pw, 389px); max-width: 100%; margin: 0 auto; border-radius: 18px; overflow: hidden; background: #EA6519; box-shadow: 0 10px 30px rgba(90, 30, 0, .18) }
.prev iframe { border: 0; display: block; width: 100%; height: 100% }
.grp { margin: 0 0 16px }
.grp b { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; letter-spacing: .04em }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chips button { font: 700 14px var(--body); min-height: 44px; min-width: 64px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; font-variant-numeric: tabular-nums }
.chips button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg) }
.chips button.today::after { content: " 오늘"; font-weight: 500; font-size: 11px; color: var(--accent) }
.chips button[aria-pressed="true"].today::after { color: var(--sun) }
#get { display: flex; align-items: center; justify-content: center; min-height: 56px; padding: 0 22px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font: 700 17px var(--body); text-decoration: none; margin: 8px 0 10px }
.note { font-size: 13px; color: var(--muted); margin: 0 }
button:focus-visible, a:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px }
</style>
</head>
<body>
<div class="wrap">
  <div class="prev" id="prev"><iframe id="frame" title="영상 미리보기 (소리 없음)"></iframe></div>
  <div>
    <h1>천사데이 D-day 영상</h1>
    <p class="sub">제14회 천사데이 찬스바자회 · 2026년 10월 17일 토요일</p>
    <div class="grp"><b>D-day</b><div class="chips" id="ds"></div></div>
    <div class="grp"><b>비율</b><div class="chips" id="ratio"><button data-v="story">9:16 릴스·스토리</button><button data-v="poster">포스터 비율</button></div></div>
    <a id="get" href="#">영상 받기</a>
    <p class="note">MP4 · 18초 · 나레이션과 배경음악 포함 · 약 20MB. 미리보기는 소리가 나지 않습니다.<br>아이폰에서는 받은 파일을 ‘파일’ 앱에서 열고 공유 → ‘비디오 저장’을 누르면 사진첩에 들어갑니다.</p>
  </div>
</div>
<script>
const EVENT = Date.UTC(2026, 9, 17), MAX = 15;
const REL = 'https://github.com/yyc9920/cheonsaday-dday/releases/download/videos-v1/';
// today's date in Korea, whatever the viewer's time zone
const k = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()).split('-').map(Number);
const today = Math.min(MAX, Math.max(0, Math.round((EVENT - Date.UTC(k[0], k[1] - 1, k[2])) / 864e5)));
const sel = { d: today, ratio: 'story' };
const label = d => d <= 0 ? 'D-DAY' : 'D-' + d;
const ds = document.getElementById('ds');
ds.innerHTML = Array.from({ length: MAX + 1 }, (_, i) => MAX - i).map(d => `<button data-v="${d}" class="${d === today ? 'today' : ''}">${label(d)}</button>`).join('');
for (const [id, key] of [['ds', 'd'], ['ratio', 'ratio']])
  document.getElementById(id).onclick = e => { const b = e.target.closest('button'); if (!b) return; sel[key] = key === 'd' ? +b.dataset.v : b.dataset.v; render(); };
let last = '';
function render() {
  for (const [id, key] of [['ds', 'd'], ['ratio', 'ratio']])
    document.querySelectorAll(`#${id} button`).forEach(b => b.setAttribute('aria-pressed', String((key === 'd' ? +b.dataset.v : b.dataset.v) === sel[key])));
  const prev = document.getElementById('prev'), w = Math.min(389, prev.parentElement.clientWidth || 389), H = sel.ratio === 'poster' ? 1512 : 1920;
  prev.style.setProperty('--pw', w + 'px'); prev.style.height = Math.round(w * H / 1080) + 'px';
  const src = `motion.html?v=1&ratio=${sel.ratio}&scale=${(w / 1080).toFixed(4)}&d=${sel.d}`;
  if (src !== last) { document.getElementById('frame').src = src; last = src; }
  const get = document.getElementById('get');
  get.href = `${REL}dday-${sel.d}-${sel.ratio}.mp4`;
  get.textContent = `${label(sel.d)} · ${sel.ratio === 'story' ? '9:16' : '포스터 비율'} 영상 받기`;
}
render();
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 200); });
</script>
</body>
</html>
