  const label = k => k === 'all' ? '전체' : k === 'picked' ? '고른 안' : GROUPS[k] ? GROUPS[k][0].split(' · ')[0] : STYLES[k][0];
  $('#filters').innerHTML = '<span class="lbl">보기</span>' + keys.map(k => `<button class="chip" data-f="${k}" aria-pressed="${k === filter}">${
    label(k)}<span class="n">${n(k)}</span></button>`).join('');
}
function renderList() {
  stopHover();
  const secs = SECTIONS.filter(s => filter === 'all' || filter === 'picked' || filter === s);
  visible = [];
  $('#list').innerHTML = secs.map(s => {
    const list = GROUPS[s] ? vitems.filter(i => i.style === s && (filter !== 'picked' || i.picked))
      : items.filter(i => i.style === s && (filter !== 'picked' || i.picked)).sort(order);
    if (!list.length) return '';
    visible.push(...list);
    const [ko, en] = GROUPS[s] || STYLES[s];
    return `<section class="sec" id="s-${s}"><h2>${ko} <span class="en">${en}</span><span class="cnt">${list.length}안</span></h2>
      <div class="grid">${list.map(cardHTML).join('')}</div></section>`;
  }).join('') || '<p class="empty">보여줄 포스터가 없어요.</p>';
  bindCards($('#list'));
}
function renderFeature() {
  const h = hero();
  $('#feature').innerHTML = `<button class="card" data-id="dday" aria-label="${h.name} 크게 보기"><img src="${url(h.still)}" alt=""><span class="live">재생 중</span></button>
    <p class="feature-cap">${h.name} — 마우스를 올리면 재생, 누르면 전체 화면</p>`;
  bindCards($('#feature'));
}
const byId = id => id === 'dday' ? hero() : all().find(i => i.id === id);

/* ---------- 소리 (영상은 늘 무음, 소리는 Web Audio 로 영상 시각에 맞춰) ---------- */
const snd = { bgm: false, narr: false };
let ac = null, gB, gN, live = [], cur = null;
const bufs = new Map();
function ensureAC() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    ac = new AC(); gB = ac.createGain(); gN = ac.createGain(); gB.connect(ac.destination); gN.connect(ac.destination);
  }
  if (ac.state !== 'running') ac.resume().catch(() => {});
  return ac;
}
function buf(src) {
  if (!bufs.has(src)) bufs.set(src, fetch(url(src)).then(r => r.arrayBuffer()).then(b => new Promise((ok, no) => ac.decodeAudioData(b, ok, no))).catch(() => null));
  return bufs.get(src);
}
function stopAudio() { live.forEach(s => { try { s.stop(); } catch (e) {} }); live = []; }
function syncAudio() {
  stopAudio();
  if (!cur || cur.video.paused || !(snd.bgm || snd.narr) || !ensureAC()) return;
  const token = cur, it = cur.item;
  gB.gain.value = snd.narr && it.narr ? 0.36 : 1;   // 나레이션이 켜지면 BGM 을 9dB 낮춤
  gN.gain.value = 1;
  [['bgm', it.bgm, gB], ['narr', it.narr, gN]].forEach(([k, src, g]) => {
    if (!snd[k] || !src) return;
    buf(src).then(b => {
      if (!b || cur !== token || token.video.paused) return;
      const off = token.video.currentTime;
      if (off >= b.duration) return;
      const s = ac.createBufferSource(); s.buffer = b; s.connect(g); s.start(0, off); live.push(s);
    });
  });
}
function paintSnd() {
  document.querySelectorAll('.snd').forEach(b => b.setAttribute('aria-pressed', snd[b.dataset.snd]));
}
document.addEventListener('click', e => {
  const b = e.target.closest('.snd'); if (!b) return;
  snd[b.dataset.snd] = !snd[b.dataset.snd];
  ensureAC(); paintSnd(); syncAudio();
});

/* 라이브 포스터(하네스 HTML) — <video> 와 같은 모양으로 다룬다: play/pause/currentTime/onplaying/onended */
class LivePlayer {
  constructor(ifr) { this.ifr = ifr; this.paused = true; this.t = 0; this.t0 = performance.now(); this.raf = 0; }
  win() { try { const w = this.ifr.contentWindow; return w && w.__seek ? w : null; } catch (e) { return null; } }
  get currentTime() { return this.paused ? this.t : (performance.now() - this.t0) / 1000; }
  set currentTime(v) { this.t = v; this.t0 = performance.now() - v * 1000; }
  async play() {
    if (!this.paused) return;
    this.paused = false; this.t0 = performance.now() - this.t * 1000;
    let w = null;
    for (let i = 0; i < 300 && !(w = this.win()); i++) { await new Promise(r => setTimeout(r, 50)); if (this.paused) return; }
    if (!w) return;
    try { await w.__ready; } catch (e) {}
    if (this.paused) return;
    const T = w.__T || 8;
    this.t0 = performance.now() - this.t * 1000;
    const tick = now => {
      if (this.paused) return;
      const t = (now - this.t0) / 1000;
      if (t >= T) { w.__seek(T - .001); this.paused = true; this.t = 0; this.onended && this.onended(); return; }
      w.__seek(Math.max(0, t)); this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
    this.onplaying && this.onplaying();
  }
  pause() {
    if (this.paused) return;
    this.t = this.currentTime; this.paused = true; cancelAnimationFrame(this.raf);
    this.onpause && this.onpause();
  }
  rest() { this.pause(); this.t = 0; const w = this.win(); if (w) w.__seek(7.9); }
}
function fit(box, ifr) {
  const k = Math.min(box.clientWidth / 700, box.clientHeight / 980);
  ifr.style.setProperty('--k', k);
  ifr.style.left = (box.clientWidth - 700 * k) / 2 + 'px'; ifr.style.top = (box.clientHeight - 980 * k) / 2 + 'px';
}
const ro = new ResizeObserver(es => es.forEach(e => { const f = e.target.querySelector('iframe'); if (f) fit(e.target, f); }));

/* 한 번에 영상 하나만: 재생 시작 → 소리 맞춤, 끝 → 처음부터 다시 */
function attach(video, item) {
  video.onplaying = () => { if (cur && cur.video === video) syncAudio(); };
  video.onpause = video.onwaiting = () => { if (cur && cur.video === video) stopAudio(); };
  video.onended = () => { video.currentTime = 0; video.play().catch(() => {}); };
  cur = { video, item };
}

/* ---------- 호버 재생 (마우스 있는 기기만) ---------- */
const canHover = matchMedia('(hover: hover) and (pointer: fine)');
let hoverCard = null;
function startHover(card) {
  if (hoverCard === card || !$('#viewer').hidden) return;
  stopHover();
  const it = byId(card.dataset.id); if (!it) return;
  hoverCard = card;
  if (it.live) {
    const p = new LivePlayer(card.querySelector('iframe'));
    card._p = p; attach(p, it); card.classList.add('playing'); p.play();
    return;
  }
  const v = document.createElement('video');
  v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = url(it.video);
  v.poster = card.querySelector('img').src;
  card.insertBefore(v, card.querySelector('.live'));
  v.addEventListener('playing', () => card.classList.add('playing'), { once: true });
  attach(v, it);
  v.play().catch(() => {});
}
function stopHover() {
  if (!hoverCard) return;
  if (hoverCard._p) {
    if (cur && cur.video === hoverCard._p) { stopAudio(); cur = null; }
    hoverCard._p.rest(); hoverCard._p = null;
    hoverCard.classList.remove('playing'); hoverCard = null; return;
  }
  const v = hoverCard.querySelector('video');
  if (cur && v && cur.video === v) { stopAudio(); cur = null; }
  if (v) { v.pause(); v.removeAttribute('src'); v.load(); v.remove(); }
  hoverCard.classList.remove('playing'); hoverCard = null;
}
function bindCards(root) {
  root.querySelectorAll('.card').forEach(card => {
    if (card.querySelector('iframe')) ro.observe(card);
    card.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse' && canHover.matches) startHover(card); });
    card.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') stopHover(); });
    card.addEventListener('click', () => openViewer(card.dataset.id));
  });
}

/* ---------- 크게 보기 (전체 화면) ---------- */
const vv = $('#vVideo'), viewer = $('#viewer');
let vIndex = -1, vList = [];
function showItem(it) {
  $('#vName').textContent = it.name;
  $('#vSub').textContent = it.dday ? it.sub : `${it.sub} · 소리 ${it.sound}`;
  $('#vWhy').textContent = it.dropped ? '폐기 이유 · ' + it.dropped : ''; $('#vWhy').hidden = !it.dropped;
  $('#vFoot').textContent = `${vIndex + 1} / ${vList.length}` + (canHover.matches ? '  ·  ← → 넘기기 · Esc 닫기' : '  ·  옆으로 밀어 넘기기');
  stopAudio(); if (cur && cur.video instanceof LivePlayer) cur.video.pause(); cur = null;
  const box = $('#vLive');
  box.innerHTML = '';
  if (it.live) {
    vv.pause(); vv.removeAttribute('src'); vv.removeAttribute('poster'); vv.load(); vv.hidden = true; box.hidden = false;
    const f = document.createElement('iframe');
    f.src = liveSrc(it, 'still'); f.tabIndex = -1; f.setAttribute('aria-hidden', 'true'); f.scrolling = 'no';
    box.appendChild(f); fit(box, f); ro.observe(box);
    const p = new LivePlayer(f); attach(p, it); p.play();
    return;
  }
  box.hidden = true; vv.hidden = false;
  vv.poster = url(it.still); vv.src = url(it.video); vv.currentTime = 0;
  attach(vv, it);
  vv.play().catch(() => {});
}
function openViewer(id) {
  stopHover();
  vList = id === 'dday' ? [hero(), ...visible] : visible;
  vIndex = Math.max(0, vList.findIndex(i => i.id === id));
  viewer.hidden = false; document.body.style.overflow = 'hidden';
  if (snd.bgm || snd.narr) ensureAC();
  showItem(vList[vIndex]);
  const fs = viewer.requestFullscreen || viewer.webkitRequestFullscreen;
  if (fs && !document.fullscreenElement) { try { const p = fs.call(viewer); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
  $('#vClose').focus({ preventScroll: true });
}
function closeViewer() {
  if (viewer.hidden) return;
  stopAudio(); if (cur && cur.video instanceof LivePlayer) cur.video.pause(); cur = null;
  vv.pause(); vv.removeAttribute('src'); vv.load(); $('#vLive').innerHTML = '';
  viewer.hidden = true; document.body.style.overflow = '';
  const fe = document.fullscreenElement || document.webkitFullscreenElement;
  if (fe) { const ex = document.exitFullscreen || document.webkitExitFullscreen; try { const p = ex.call(document); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
}
function step(d) { if (!vList.length) return; vIndex = (vIndex + d + vList.length) % vList.length; showItem(vList[vIndex]); }
$('#vClose').onclick = closeViewer;
$('#vPrev').onclick = () => step(-1);
$('#vNext').onclick = () => step(1);
const onFs = () => { if (!(document.fullscreenElement || document.webkitFullscreenElement) && !viewer.hidden) closeViewer(); };
document.addEventListener('fullscreenchange', onFs);
document.addEventListener('webkitfullscreenchange', onFs);
document.addEventListener('keydown', e => {
  if (viewer.hidden) return;
  if (e.key === 'Escape') closeViewer();
  else if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'ArrowRight') step(1);
});
let sx = null;
viewer.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') sx = [e.clientX, e.clientY]; });
viewer.addEventListener('pointerup', e => {
  if (!sx) return; const dx = e.clientX - sx[0], dy = e.clientY - sx[1]; sx = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) step(dx < 0 ? 1 : -1);
});
document.addEventListener('visibilitychange', () => { if (document.hidden) { stopHover(); if (!viewer.hidden && cur) cur.video.pause(); } else if (!viewer.hidden && cur) { const p = cur.video.play(); if (p && p.catch) p.catch(() => {}); } });

$('#filters').addEventListener('click', e => {
  const b = e.target.closest('[data-f]'); if (!b) return;
  filter = b.dataset.f; renderFilters(); renderList();
});

paintDday(); paintSnd(); renderFeature(); renderFilters(); renderList();
setInterval(() => { const before = D.label; paintDday(); if (D.label !== before) renderFeature(); }, 60000);
</script>
</body>
</html>
