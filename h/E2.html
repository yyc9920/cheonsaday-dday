        a.pause(); anims.push(a);
      });
    },
    onSeek(fn) { seekFns.push(fn); },
  };
  P.build(root, ctx);
  const seek = t => { const ms = t * 1000; for (const a of anims) a.currentTime = ms; for (const f of seekFns) f(t); };
  seek(P.T);
  return { T: P.T, seek, root, name: P.name };
};

<script>
POSTERS.E2 = {
  name: '네오 Y2K · 크롬 오브젝트',
  T: 8,
  build(root, ctx) {
    const D = ctx.D;
    root.querySelectorAll('[data-k]').forEach(el => { el.textContent = D[el.dataset.k]; });
    // tagline split into two lines (same characters): '기부 천사가 될 수 있는' + '단 하루!'
    const tl = D.tagline, cut = tl.indexOf('단 하루');
    root.querySelector('.pE2-tl1').textContent = tl.slice(0, cut);
    root.querySelector('.pE2-tl2').textContent = tl.slice(cut);

    const plate = ctx.asset('E2/plate.webp');
    const wings = ctx.asset('E2/wings.webp');
    const bag = ctx.asset('E2/bag.webp');
    const star = ctx.asset('E2/star.webp');
    root.querySelector('.pE2-plate img').src = plate;
    root.querySelectorAll('.pE2-wimg').forEach(i => { i.src = wings; });
    root.querySelector('.pE2-bimg').src = bag;
    root.querySelectorAll('.pE2-stw img').forEach(i => { i.src = star; });
    const mask = (sel, src) => root.querySelectorAll(sel).forEach(el => { el.style.webkitMaskImage = `url("${src}")`; el.style.maskImage = `url("${src}")`; });
    mask('.pE2-wgl', wings); mask('.pE2-bgl', bag);

    root.querySelector('.pE2-qr').innerHTML = qrSVG('#1f1a45', '#ffffff', 3);

    const S = 'steps(1,end)';
    // ---- plate ----
    ctx.anim('.pE2-plate', [{ transform: 'scale(1.14)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { at: 0, dur: 1.3, ease: 'cubic-bezier(.2,.7,.2,1)' });
    ctx.anim('.pE2-veil', [{ opacity: 0 }, { opacity: 1 }], { at: .2, dur: .8 });
    ctx.anim('.pE2-top > *', [{ transform: 'translateY(-60px)', opacity: 0 }, { transform: 'translateY(4px)', opacity: 1, offset: .7 }, { transform: 'none', opacity: 1 }], { at: .15, dur: .55, stagger: .1 });

    // ---- title: chrome flips up + RGB glitch ----
    const glitch = (sel, at, k) => {
      ctx.anim(sel, [{ transform: 'perspective(700px) rotateX(75deg) scale(.85)' }, { transform: 'perspective(700px) rotateX(-8deg) scale(1.02)', offset: .6 }, { transform: 'none' }], { at, dur: .8, ease: 'cubic-bezier(.2,.8,.25,1)' });
      ctx.anim(sel + ' .pE2-tg', [
        { opacity: 0, transform: 'translate(0,0) skewX(0)', easing: S },
        { opacity: 1, transform: `translate(${-14 * k}px,0) skewX(-8deg)`, offset: .14, easing: S },
        { opacity: .35, transform: `translate(${10 * k}px,${-3 * k}px) skewX(6deg)`, offset: .28, easing: S },
        { opacity: 1, transform: `translate(${-6 * k}px,${2 * k}px)`, offset: .42, easing: S },
        { opacity: 1, transform: `translate(${3 * k}px,0)`, offset: .58, easing: S },
        { opacity: 1, transform: 'none' },
      ], { at, dur: .9, ease: 'linear' });
      const rgb = (cls, s) => ctx.anim(sel + ' .pE2-rgb.' + cls, [
        { visibility: 'visible', opacity: 0, transform: 'none', clipPath: 'inset(0 0 0 0)', easing: S },
        { opacity: .95, transform: `translate(${-16 * k * s}px,${-4 * k * s}px)`, clipPath: s > 0 ? 'inset(8% 0 48% 0)' : 'inset(44% 0 8% 0)', offset: .1, easing: S },
        { opacity: .95, transform: `translate(${12 * k * s}px,${3 * k * s}px)`, clipPath: 'inset(0 0 0 0)', offset: .26, easing: S },
        { opacity: .9, transform: `translate(${-9 * k * s}px,0)`, clipPath: s > 0 ? 'inset(56% 0 4% 0)' : 'inset(4% 0 60% 0)', offset: .42, easing: S },
        { opacity: .8, transform: `translate(${-5 * k * s}px,${2 * k * s}px)`, clipPath: 'inset(0 0 0 0)', offset: .58, easing: S },
        { opacity: .6, transform: `translate(${-3 * k * s}px,0)`, clipPath: 'inset(0 0 0 0)', offset: .74 },
        { visibility: 'visible', opacity: 0, transform: 'none', clipPath: 'inset(0 0 0 0)', offset: .99 },
        { visibility: 'hidden', opacity: 0, transform: 'none', clipPath: 'inset(0 0 0 0)' },
      ], { at, dur: 1.4, ease: 'linear' });
      rgb('r', 1); rgb('c', -1);
    };
    glitch('.pE2-t1', .35, 1);
    glitch('.pE2-t2', .75, .8);
    // sheen sweep on title (off-glyph at t=8: (8-at)/dur integer)
    const sweep = [{ backgroundPosition: '130% 0', offset: 0 }, { backgroundPosition: '-30% 0', offset: .55 }, { backgroundPosition: '-30% 0', offset: 1 }];
    ctx.anim('.pE2-t1 .pE2-sheen', sweep, { at: 2.0, dur: 2.0, iter: Infinity, ease: 'cubic-bezier(.45,0,.3,1)' });
    ctx.anim('.pE2-t2 .pE2-sheen', sweep, { at: 2.4, dur: 2.8, iter: Infinity, ease: 'cubic-bezier(.45,0,.3,1)' });

    // ---- wings: 3D unfold from the joint, then gentle flap + float ----
    ctx.anim('.pE2-wh.L', [{ transform: 'perspective(900px) rotateY(88deg) rotateZ(14deg)', opacity: 0 }, { transform: 'perspective(900px) rotateY(-10deg) rotateZ(-3deg)', opacity: 1, offset: .62 }, { transform: 'none', opacity: 1 }], { at: 1.0, dur: 1.1, ease: 'cubic-bezier(.2,.75,.25,1)' });
    ctx.anim('.pE2-wh.R', [{ transform: 'perspective(900px) rotateY(-88deg) rotateZ(-14deg)', opacity: 0 }, { transform: 'perspective(900px) rotateY(10deg) rotateZ(3deg)', opacity: 1, offset: .62 }, { transform: 'none', opacity: 1 }], { at: 1.0, dur: 1.1, ease: 'cubic-bezier(.2,.75,.25,1)' });
    ctx.anim('.pE2-wh.L .pE2-wfl', [{ transform: 'none' }, { transform: 'rotate(-3deg)' }], { at: 2.0, dur: 1.0, iter: Infinity, dir: 'alternate', ease: 'ease-in-out' });
    ctx.anim('.pE2-wh.R .pE2-wfl', [{ transform: 'none' }, { transform: 'rotate(3deg)' }], { at: 2.0, dur: 1.0, iter: Infinity, dir: 'alternate', ease: 'ease-in-out' });
    ctx.anim('.pE2-wf', [{ transform: 'none' }, { transform: 'translateY(-9px)' }], { at: 2.0, dur: 1.5, iter: Infinity, dir: 'alternate', ease: 'ease-in-out' });

    // ---- bag: spins in tilted, lands; float on a different rhythm (parallax) ----
    ctx.anim('.pE2-bt', [
      { transform: 'perspective(700px) translateY(-180px) rotateY(-150deg) rotateZ(-16deg) scale(.45)', opacity: 0 },
      { transform: 'perspective(700px) translateY(-40px) rotateY(-40deg) rotateZ(-6deg) scale(.85)', opacity: 1, offset: .45 },
      { transform: 'perspective(700px) translateY(8px) rotateY(14deg) rotateZ(3deg) scale(1.04)', opacity: 1, offset: .75 },
      { transform: 'none', opacity: 1 },
    ], { at: 1.35, dur: 1.15, ease: 'cubic-bezier(.25,.7,.3,1)' });
    ctx.anim('.pE2-shadow', [{ transform: 'scale(.3)', opacity: 0 }, { transform: 'none', opacity: 1 }], { at: 1.7, dur: .8 });
    ctx.anim('.pE2-bf', [{ transform: 'none' }, { transform: 'translateY(-4px)' }], { at: 2.4, dur: 1.4, iter: Infinity, dir: 'alternate', ease: 'ease-in-out' });

    // gloss sweeps across chrome (masked to silhouette; off-object at t=8)
    const gsweep = [{ backgroundPosition: '130% 0', offset: 0 }, { backgroundPosition: '-30% 0', offset: .5 }, { backgroundPosition: '-30% 0', offset: 1 }];
    ctx.anim('.pE2-bgl', gsweep, { at: 2.6, dur: 2.7, iter: Infinity, ease: 'cubic-bezier(.45,0,.35,1)' });
    ctx.anim('.pE2-wgl', gsweep, { at: 2.0, dur: 3.0, iter: Infinity, ease: 'cubic-bezier(.45,0,.35,1)' });

    // ---- stars: pop with spin, float (own depth), twinkle ----
    const stars = [...root.querySelectorAll('.pE2-st')];
    stars.forEach((el, i) => {
      const at = 1.8 + i * .16;
      ctx.anim(el.querySelector('.pE2-stp'), [{ transform: 'scale(0) rotate(-120deg)', opacity: 0 }, { transform: 'scale(1.3) rotate(10deg)', opacity: 1, offset: .6 }, { transform: 'none', opacity: 1 }], { at, dur: .55 });
      const fAt = 2.6 + i * .1, fDur = (8 - fAt) / 4, amp = [14, 10, 7, 9, 6, 11][i];
      ctx.anim(el.querySelector('.pE2-stf'), [{ transform: 'none' }, { transform: `translateY(${-amp}px)` }], { at: fAt, dur: fDur, iter: Infinity, dir: 'alternate', ease: 'ease-in-out' });
      const tAt = 2.7 + i * .23, tDur = (8 - tAt) / 3;
      ctx.anim(el.querySelector('.pE2-stw'), [
        { transform: 'none', opacity: 1 }, { transform: 'scale(.45) rotate(20deg)', opacity: .35, offset: .18 },
        { transform: 'scale(1.18)', opacity: 1, offset: .32 }, { transform: 'none', opacity: 1, offset: .45 }, { transform: 'none', opacity: 1 },
      ], { at: tAt, dur: tDur, iter: Infinity, ease: 'ease-in-out' });
    });

    // ---- string + hanging tag swings in (pendulum from the bag charm) ----
    const str = root.querySelector('.pE2-str'); const L = 140; str.style.strokeDasharray = L;
    ctx.anim(str, [{ strokeDashoffset: L }, { strokeDashoffset: 0 }], { at: 2.45, dur: .35, ease: 'linear' });
    ctx.anim('.pE2-tag', [
      { transform: 'translateY(-60px) rotate(32deg)', opacity: 0 },
      { transform: 'rotate(-14deg)', opacity: 1, offset: .28 },
      { transform: 'rotate(8deg)', opacity: 1, offset: .5 },
      { transform: 'rotate(-4deg)', opacity: 1, offset: .7 },
      { transform: 'rotate(1.5deg)', opacity: 1, offset: .86 },
      { transform: 'none', opacity: 1 },
    ], { at: 2.7, dur: 1.6, ease: 'ease-in-out' });
    ctx.anim('.pE2-tagc > *', [{ opacity: 0 }, { opacity: 1 }], { at: 3.2, dur: .3, stagger: .1 });

    // stickers pop from the bag
    const pop = (sel, at, from) => ctx.anim(sel, [
      { transform: `translate(${from}px,10px) scale(.2) rotate(${from > 0 ? 20 : -20}deg)`, opacity: 0 },
      { transform: 'scale(1.1)', opacity: 1, offset: .6 },
      { transform: 'scale(.97)', opacity: 1, offset: .8 },
      { transform: 'none', opacity: 1 },
    ], { at, dur: .55, ease: 'cubic-bezier(.3,.6,.3,1)' });
    pop('.pE2-bub', 3.0, 120);
    pop('.pE2-dd', 3.25, -120);
    ctx.anim('.pE2-ddi', [{ transform: 'rotate(4deg)' }, { transform: 'rotate(-2deg)' }], { at: 4.0, dur: 1.0, iter: Infinity, dir: 'alternate', ease: 'ease-in-out' });

    // QR compact flips open in 3D (flat at rest)
    ctx.anim('.pE2-qb', [{ transform: 'perspective(700px) rotateY(-95deg)', opacity: 0 }, { transform: 'perspective(700px) rotateY(10deg)', opacity: 1, offset: .65 }, { transform: 'none', opacity: 1 }], { at: 3.5, dur: .8 });
    ctx.anim('.pE2-qr', [{ opacity: 0, easing: S }, { opacity: .5, offset: .3, easing: S }, { opacity: 0, offset: .5, easing: S }, { opacity: 1, offset: .7 }, { opacity: 1 }], { at: 4.0, dur: .5, ease: 'linear' });

    ctx.anim('.pE2-foot', [{ transform: 'translateY(80px)' }, { transform: 'none' }], { at: 4.3, dur: .6 });
  },
};
</script>

<script>
window.__ready = (async () => {
  await document.fonts.ready;
  const m = mountPoster('E2', document.getElementById('cap'));
  await Promise.all([...document.querySelectorAll('#cap img')].map(i => i.decode ? i.decode().catch(() => {}) : 0));
  // 한글 폰트 조각(unicode-range)은 글자가 놓인 뒤에야 받기 시작한다 — 붙인 뒤 로딩이 끝날 때까지 기다린다
  for (let i = 0; i < 40; i++) {
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    await document.fonts.ready;
    if (document.fonts.status === 'loaded' && [...document.fonts].every(f => f.status !== 'loading')) break;
  }
  window.__T = m.T; window.__seek = t => m.seek(t);
  const q = new URLSearchParams(location.search);
  if (q.has('t')) m.seek(+q.get('t')); else if (!q.has('still')) {
    let t0 = performance.now(); const tick = now => { m.seek(((now - t0) / 1000) % m.T); requestAnimationFrame(tick); }; requestAnimationFrame(tick);
  }
  return true;
})();
</script></body></html>
