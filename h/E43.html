      { transform: 'none' },
    ], { at: 0, dur: 3.0, ease: 'cubic-bezier(.55,0,.25,1)' });
    ctx.anim('.pE43-rt', [{ transform: 'rotateY(-70deg) scale(.6)', opacity: 0 }, { transform: 'rotateY(12deg) scale(1.04)', opacity: 1, offset: .6 }, { transform: 'none', opacity: 1 }], { at: .05, dur: 1.0, ease: 'cubic-bezier(.25,.7,.3,1)' });
    ctx.anim('.pE43-rf', [{ transform: 'none' }, { transform: 'translateY(-6px) rotate(-1.5deg)' }], { at: 3.4, dur: 1.15, iter: Infinity, dir: 'alternate', ease: 'ease-in-out' });
    ctx.anim('.pE43-rgl', [{ backgroundPosition: '130% 0', offset: 0 }, { backgroundPosition: '-30% 0', offset: .5 }, { backgroundPosition: '-30% 0', offset: 1 }], { at: 1.1, dur: 2.3, iter: Infinity, ease: 'cubic-bezier(.45,0,.35,1)' });

    // letters rise out of the floor like chrome slabs (pivot at the base)
    const rise = (sel, at, sy) => {
      ctx.anim(sel, [
        { transform: `perspective(900px) translateY(220px) rotateX(-80deg) scaleY(${sy})`, opacity: 0 },
        { transform: `perspective(900px) translateY(-12px) rotateX(10deg) scaleY(${sy})`, opacity: 1, offset: .65 },
        { transform: `perspective(900px) scaleY(${sy})`, opacity: 1 },
      ], { at, dur: 1.0, ease: 'cubic-bezier(.2,.75,.25,1)' });
    };
    rise('.pE43-t1', .9, 1.32);
    rise('.pE43-t2', 1.25, 1.22);
    ctx.anim('.pE43-floor', [{ opacity: 0, transform: 'translateY(80px)' }, { opacity: .9, transform: 'none' }], { at: .7, dur: 1.2 });
    const sweep = [{ backgroundPosition: '130% 0', offset: 0 }, { backgroundPosition: '-30% 0', offset: .55 }, { backgroundPosition: '-30% 0', offset: 1 }];
    ctx.anim('.pE43-t1 .pE43-sheen', sweep, { at: 2.6, dur: 2.7, iter: Infinity, ease: 'cubic-bezier(.45,0,.3,1)' });
    ctx.anim('.pE43-t2 .pE43-sheen', sweep, { at: 3.0, dur: 2.5, iter: Infinity, ease: 'cubic-bezier(.45,0,.3,1)' });

    // UI around it drops in once the camera has settled
    ctx.anim('.pE43-top > *', [{ transform: 'translateY(-70px)', opacity: 0 }, { transform: 'translateY(4px)', opacity: 1, offset: .7 }, { transform: 'none', opacity: 1 }], { at: 2.7, dur: .5, stagger: .1 });
    ctx.anim('.pE43-bub', [{ transform: 'translate(150px,40px) scale(.2)', opacity: 0 }, { transform: 'scale(1.08)', opacity: 1, offset: .6 }, { transform: 'none', opacity: 1 }], { at: 3.0, dur: .5 });
    ctx.anim('.pE43-info', [{ transform: 'translateY(300px)' }, { transform: 'translateY(-6px)', offset: .7 }, { transform: 'none' }], { at: 3.3, dur: .6 });
    ctx.anim('.pE43-info > *', [{ opacity: 0, transform: 'translateX(-14px)' }, { opacity: 1, transform: 'none' }], { at: 3.65, dur: .3, stagger: .09 });
    ctx.anim('.pE43-qb', [{ transform: 'translateY(300px)' }, { transform: 'translateY(-6px)', offset: .7 }, { transform: 'none' }], { at: 3.5, dur: .6 });
    ctx.anim('.pE43-foot', [{ transform: 'translateY(74px)' }, { transform: 'none' }], { at: 3.2, dur: .5 });
    root.querySelectorAll('.pE43-st').forEach((el, i) => {
      const at = 3.6 + i * .15;
      ctx.anim(el.querySelector('.pE43-stp'), [{ transform: 'scale(0) rotate(-120deg)', opacity: 0 }, { transform: 'scale(1.3) rotate(10deg)', opacity: 1, offset: .6 }, { transform: 'none', opacity: 1 }], { at, dur: .5 });
      const tAt = 4.3 + i * .3, tDur = (8 - tAt) / 3;
      ctx.anim(el.querySelector('.pE43-stw'), [{ transform: 'none', opacity: 1 }, { transform: 'scale(.5) rotate(20deg)', opacity: .4, offset: .2 }, { transform: 'scale(1.15)', opacity: 1, offset: .35 }, { transform: 'none', opacity: 1, offset: .5 }, { transform: 'none', opacity: 1 }], { at: tAt, dur: tDur, iter: Infinity });
    });
  },
};
</script>

<script>
window.__ready = (async () => {
  await document.fonts.ready;
  const m = mountPoster('E43', document.getElementById('cap'));
  await Promise.all([...document.querySelectorAll('#cap img')].map(i => i.decode ? i.decode().catch(() => {}) : 0));
  // 한글 폰트 조각(unicode-range)은 글자가 놓인 뒤에야 받기 시작한다 — 붙인 뒤 로딩이 끝날 때까지 기다린다
  for (let i = 0; i < 40; i++) {
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    await document.fonts.ready;
    if (document.fonts.status === 'loaded' && [...document.fonts].every(f => f.status !== 'loading')) break;
  }
  window.__T = m.T; window.__seek = t => m.seek(t);
  const q = new URLSearchParams(location.search);
  if (q.has('t')) m.seek(+q.get('t')); else if (!q.has('still')) {
    let t0 = performance.now(); const tick = now => { m.seek(((now - t0) / 1000) % m.T); requestAnimationFrame(tick); }; requestAnimationFrame(tick);
  }
  return true;
})();
</script></body></html>
