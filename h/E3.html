<script>// 포스터 시안 공용 키트 — 모든 안이 같은 문구·같은 시간축(seek)을 쓴다.
// 포스터 설계 크기: 700 x 980 (원본 포스터 5:7). 호스트가 transform으로 축소한다.
window.POSTERS = window.POSTERS || {};

// 원본 포스터(poster-original.jpeg) 문구 그대로. 안마다 빼지 말 것.
window.D = {
  edition: '제14회',
  purpose: '장학기금 마련과 불우이웃 돕기를 위한',
  title1: '천사데이',
  title2: '찬스바자회',
  dateLong: '2026년 10월 17일 (토)',
  dateShort: '10.17',
  year: '2026',
  weekday: '토',
  weekdayLong: '토요일',
  time: '오전 9시 30분 – 오후 5시',
  timeShort: '9:30 – 17:00',
  venue: '홀리씨즈교회',
  address: '서초구 동광로 8길 1',
  tagline: '기부 천사가 될 수 있는 단 하루!',
  welcome: 'WELCOME TO BAZAAR',
  contactLabel: '문의', contact: '02-593-0777',
  hostLabel: '주최·주관', host: '홀리씨즈교회 / HSS(홀리씨즈스쿨)',
  sponsorLabel: '후원', sponsor: '글로벌선교회, (사)세계청소년문화육성협회',
  // v3: hssbazaar.kr 'BAZAAR 2026 · 판매관과 라인업' 페이지의 판매관 이름 그대로 (가격·할인율은 넣지 않는다)
  booths: ['홀리파머스마켓', '홀리피셔마켓', '홀리플리마켓', '홀리약국', '아동용품관', '의류 및 악세사리관', '리빙관', '슈즈관', '푸드코트', '재능기부 마켓'],
};
// 오늘 기준 D-day (행사일 2026-10-17)
(() => {
  const now = (() => { try { const q = new URLSearchParams(parent.location.search).get('today'); if (q && /^\d{4}-\d{2}-\d{2}$/.test(q)) return new Date(q + 'T12:00:00'); } catch (e) {} return new Date(Date.now() + (new Date().getTimezoneOffset() + 540) * 6e4); })(); const ev = new Date(2026, 9, 17);
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const n = Math.round((ev - today) / 864e5);
  window.D.dday = n > 0 ? 'D-' + n : n === 0 ? 'D-DAY' : 'D+' + (-n);
})();

// 사용자 제공 QR(Linktree) 해독 주소 그대로 다시 만든 QR. 오류정정 Q, 37x37 모듈.
window.QR = { url: "https://linktr.ee/qr/87da1411-68b8-4bdd-a08f-fee0cb8254ef", rows: ["1111111001111101010001001101001111111", "1000001000101100100101001010001000001", "1011101010101100110011001001101011101", "1011101000100000101010011110101011101", "1011101011010111010100111111001011101", "1000001010100111001110100010101000001", "1111111010101010101010101010101111111", "0000000000101001000011110000000000000", "0100101011000001001001000011110110100", "1111000010011111000110111001000011010", "0001111100011101001011111111110001010", "0111000001111101010101110011110000100", "0010001001101100110111001001011000110", "1000000100111000100000110111110110100", "0111001011101100011011110111110011100", "1011110001011100010011101011000000111", "1100111100111111111000011000111001110", "0111100000100101100110010111010011000", "1100111111110101110101011011011110100", "0110000011000111001111111000010110100", "1001011000100101101011101001001000100", "0101010100001010101000110111000011000", "0000101010100010111101111011110001000", "1011110101111101011001011010101101100", "0111111101010001101011010011111001110", "1100110110000011101001111001000111000", "0011111100101010001111111011110100110", "0010100011100101100001110000101100100", "1111001110111111001011101000111110101", "0000000010110011100001010111100011000", "1111111000100100001000011010101011110", "1000001001100000110010110001100010111", "1011101011101100011000111000111111101", "1011101000011001001110010111001101010", "1011101000100111110010010010001100110", "1000001011111110100001111001010001110", "1111111000010100101111001010000100111"] };
// QR SVG 문자열. fg 짙은 색 / bg 밝은 색 (반전 금지 — 스캐너가 못 읽는 경우가 있다), quiet = 여백 모듈 수(최소 2).
window.qrSVG = (fg = '#111', bg = '#fff', quiet = 3) => {
  const R = window.QR.rows, n = R.length, N = n + quiet * 2; let d = '';
  R.forEach((row, y) => { for (let x = 0; x < n; x++) if (row[x] === '1') { let w = 1; while (x + w < n && row[x + w] === '1') w++; d += `M${x + quiet} ${y + quiet}h${w}v1h-${w}z`; x += w - 1; } });
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${N} ${N}" shape-rendering="crispEdges" role="img" aria-label="QR 코드"><rect width="${N}" height="${N}" fill="${bg}"/><path d="${d}" fill="${fg}"/></svg>`;
};

// 이름에 확장자가 없으면 v1 잘라 낸 레이어(assets/<name>.png), 있으면 assets/<경로> (예: 'A2/plate.webp'). 빌드 때 data URI로 바뀐다.
window.ASSET = name => (window.ASSETS && window.ASSETS[name]) || ('assets/' + (/\.\w+$/.test(name) ? name : name + '.png'));

// 결정적 난수 (seek 해도 같은 결과)
window.mulberry = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

// code 안의 포스터를 host 안에 붙이고 {T, seek} 를 돌려준다.
// build(root, ctx) 규약:
//   ctx.anim(target, keyframes, {at, dur, ease, iter, dir, stagger, composite})
//       target = 요소 | root 기준 선택자. at·dur·stagger 는 초. fill 은 'both' 고정.
//       기본 상태(CSS)는 '완성된 포스터'. 키프레임은 숨은 상태에서 시작해 완성 상태로 끝나게.
//   ctx.onSeek(fn(t))  — JS로 그리는 효과(글자 섞기, 캔버스)용. t 초.
//   ctx.D, ctx.asset(name), ctx.rand(seed)
window.mountPoster = function (code, host) {
  const P = POSTERS[code];
  const tpl = document.getElementById('tpl-' + code);
  host.appendChild(tpl.content.cloneNode(true));
  const root = host.querySelector('.p' + code);
  const anims = [], seekFns = [];
  const ctx = {
    D: window.D, asset: window.ASSET, rand: window.mulberry,
    anim(target, kf, o = {}) {
      const els = typeof target === 'string' ? [...root.querySelectorAll(target)] : (target instanceof Element ? [target] : [...target]);
      els.forEach((el, i) => {
        const a = el.animate(kf, {
          duration: (o.dur ?? 0.6) * 1000, delay: ((o.at ?? 0) + i * (o.stagger ?? 0)) * 1000,
          easing: o.ease ?? 'cubic-bezier(.2,.8,.2,1)', iterations: o.iter ?? 1, direction: o.dir ?? 'normal',
          fill: 'both', composite: o.composite ?? 'replace',
        });
        a.pause(); anims.push(a);
      });
    },
    onSeek(fn) { seekFns.push(fn); },
  };
  P.build(root, ctx);
  const seek = t => { const ms = t * 1000; for (const a of anims) a.currentTime = ms; for (const f of seekFns) f(t); };
  seek(P.T);
  return { T: P.T, seek, root, name: P.name };
};
// v4: 홀리피셔마켓은 올해 열리지 않을 수 있어 뺀 목록. v4 포스터는 이것을 **이름으로** 고른다(인덱스 금지 — v3 는 booths 인덱스를 씀).
window.D.booths4 = window.D.booths.filter(b => b !== '홀리피셔마켓');
</script>

<script>
POSTERS.E3 = {
  name: '네오 Y2K · 크롬 바자회 물건',
  T: 8,
  build(root, ctx) {
    const D = ctx.D;
    root.querySelectorAll('[data-k]').forEach(el => { el.textContent = D[el.dataset.k]; });
    const tl = D.tagline, cut = tl.indexOf('단 하루');
    root.querySelector('.pE3-tl1').textContent = tl.slice(0, cut);
    root.querySelector('.pE3-tl2').textContent = tl.slice(cut);

    const plate = ctx.asset('E3/plate.webp');
    const wings = ctx.asset('E3/wings.webp');
    const star = ctx.asset('E3/star.webp');
    const src = {
      bag: ctx.asset('E3/bag.webp'),
      heel: ctx.asset('E3/heel.webp'),
      crab: ctx.asset('E3/crab.webp'),
      rose: ctx.asset('E3/rose.webp'),
    };
    root.querySelector('.pE3-plate img').src = plate;
    root.querySelectorAll('.pE3-wimg').forEach(i => { i.src = wings; });
    root.querySelectorAll('.pE3-stw img').forEach(i => { i.src = star; });
    const mask = (el, s) => { el.style.webkitMaskImage = `url("${s}")`; el.style.maskImage = `url("${s}")`; };
    root.querySelectorAll('.pE3-wgl').forEach(el => mask(el, wings));

    // object boxes [left, top, width, height, rest rotation]
    const OB = {
      heel: [460, 362, 230, 168, -8],
      rose: [474, 472, 210, 210, 0],
      bag:  [222, 352, 260, 283, 0],
      crab: [8, 400, 204, 272, -6],
    };
    Object.entries(OB).forEach(([k, [l, t, w, h, r]]) => {
      const ob = root.querySelector('.pE3-o-' + k);
      Object.assign(ob.style, { left: l + 'px', top: t + 'px', width: w + 'px', height: h + 'px', transform: r ? `rotate(${r}deg)` : '' });
      ob.querySelector('img').src = src[k];
      mask(ob.querySelector('.pE3-gl'), src[k]);
    });
    const [bl, bt, bw, bh] = OB.bag;
    Object.assign(root.querySelector('.pE3-bsh').style, { left: (bl + 6) + 'px', top: (bt + bh - 22) + 'px', width: (bw - 12) + 'px', height: '34px' });

    root.querySelector('.pE3-qr').innerHTML = qrSVG('#1f1a45', '#ffffff', 3);

    const S = 'steps(1,end)';
    // ---- plate ----
    ctx.anim('.pE3-plate', [{ transform: 'scale(1.14)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { at: 0, dur: 1.3, ease: 'cubic-bezier(.2,.7,.2,1)' });
    ctx.anim('.pE3-veil', [{ opacity: 0 }, { opacity: 1 }], { at: .2, dur: .8 });
    ctx.anim('.pE3-top > *', [{ transform: 'translateY(-60px)', opacity: 0 }, { transform: 'translateY(4px)', opacity: 1, offset: .7 }, { transform: 'none', opacity: 1 }], { at: .15, dur: .55, stagger: .1 });

    // ---- title: chrome flips up + RGB glitch ----
    const glitch = (sel, at, k) => {
      ctx.anim(sel, [{ transform: 'perspective(700px) rotateX(75deg) scale(.85)' }, { transform: 'perspective(700px) rotateX(-8deg) scale(1.02)', offset: .6 }, { transform: 'none' }], { at, dur: .8, ease: 'cubic-bezier(.2,.8,.25,1)' });
      ctx.anim(sel + ' .pE3-tg', [
        { opacity: 0, transform: 'translate(0,0) skewX(0)', easing: S },
        { opacity: 1, transform: `translate(${-14 * k}px,0) skewX(-8deg)`, offset: .14, easing: S },
        { opacity: .35, transform: `translate(${10 * k}px,${-3 * k}px) skewX(6deg)`, offset: .28, easing: S },
        { opacity: 1, transform: `translate(${-6 * k}px,${2 * k}px)`, offset: .42, easing: S },
        { opacity: 1, transform: `translate(${3 * k}px,0)`, offset: .58, easing: S },
        { opacity: 1, transform: 'none' },
      ], { at, dur: .9, ease: 'linear' });
      const rgb = (cls, s) => ctx.anim(sel + ' .pE3-rgb.' + cls, [
        { visibility: 'visible', opacity: 0, transform: 'none', clipPath: 'inset(0 0 0 0)', easing: S },
        { opacity: .95, transform: `translate(${-16 * k * s}px,${-4 * k * s}px)`, clipPath: s > 0 ? 'inset(8% 0 48% 0)' : 'inset(44% 0 8% 0)', offset: .1, easing: S },
        { opacity: .95, transform: `translate(${12 * k * s}px,${3 * k * s}px)`, clipPath: 'inset(0 0 0 0)', offset: .26, easing: S },
        { opacity: .9, transform: `translate(${-9 * k * s}px,0)`, clipPath: s > 0 ? 'inset(56% 0 4% 0)' : 'inset(4% 0 60% 0)', offset: .42, easing: S },
        { opacity: .8, transform: `translate(${-5 * k * s}px,${2 * k * s}px)`, clipPath: 'inset(0 0 0 0)', offset: .58, easing: S },
        { opacity: .6, transform: `translate(${-3 * k * s}px,0)`, clipPath: 'inset(0 0 0 0)', offset: .74 },
        { visibility: 'visible', opacity: 0, transform: 'none', clipPath: 'inset(0 0 0 0)', offset: .99 },
        { visibility: 'hidden', opacity: 0, transform: 'none', clipPath: 'inset(0 0 0 0)' },
      ], { at, dur: 1.4, ease: 'linear' });
      rgb('r', 1); rgb('c', -1);
    };
    glitch('.pE3-t1', .35, 1);
    glitch('.pE3-t2', .75, .8);
    const sweep = [{ backgroundPosition: '130% 0', offset: 0 }, { backgroundPosition: '-30% 0', offset: .55 }, { backgroundPosition: '-30% 0', offset: 1 }];
    ctx.anim('.pE3-t1 .pE3-sheen', sweep, { at: 2.0, dur: 2.0, iter: Infinity, ease: 'cubic-bezier(.45,0,.3,1)' });
    ctx.anim('.pE3-t2 .pE3-sheen', sweep, { at: 2.4, dur: 2.8, iter: Infinity, ease: 'cubic-bezier(.45,0,.3,1)' });

    // ---- wings: 3D unfold from the joint, then gentle flap + float ----
    ctx.anim('.pE3-wh.L', [{ transform: 'perspective(900px) rotateY(88deg) rotateZ(14deg)', opacity: 0 }, { transform: 'perspective(900px) rotateY(-10deg) rotateZ(-3deg)', opacity: 1, offset: .62 }, { transform: 'none', opacity: 1 }], { at: 1.0, dur: 1.1, ease: 'cubic-bezier(.2,.75,.25,1)' });
    ctx.anim('.pE3-wh.R', [{ transform: 'perspective(900px) rotateY(-88deg) rotateZ(-14deg)', opacity: 0 }, { transform: 'perspective(900px) rotateY(10deg) rotateZ(3deg)', opacity: 1, offset: .62 }, { transform: 'none', opacity: 1 }], { at: 1.0, dur: 1.1, ease: 'cubic-bezier(.2,.75,.25,1)' });
    ctx.anim('.pE3-wh.L .pE3-wfl', [{ transform: 'none' }, { transform: 'rotate(-3deg)' }], { at: 2.0, dur: 1.0, iter: Infinity, dir: 'alternate', ease: 'ease-in-out' });
    ctx.anim('.pE3-wh.R .pE3-wfl', [{ transform: 'none' }, { transform: 'rotate(3deg)' }], { at: 2.0, dur: 1.0, iter: Infinity, dir: 'alternate', ease: 'ease-in-out' });
    ctx.anim('.pE3-wf', [{ transform: 'none' }, { transform: 'translateY(-9px)' }], { at: 2.0, dur: 1.5, iter: Infinity, dir: 'alternate', ease: 'ease-in-out' });

    // ---- objects: each spins in from its own side like a chrome toy, lands, then floats on its own rhythm ----
    // [selector-key, at, fromX, fromY, spin, float amp, float half-cycles count]
    const IN = [
      ['bag', 1.35, 0, -180, -150, 5, 4],
      ['crab', 1.75, -260, 60, 160, 7, 6],
      ['heel', 2.0, 260, -80, -170, 8, 6],
      ['rose', 2.2, -220, -120, 140, 6, 8],
    ];
    IN.forEach(([k, at, fx, fy, sp, amp, n]) => {
      const ob = '.pE3-o-' + k;
      ctx.anim(ob + ' .pE3-obt', [
        { transform: `perspective(700px) translate(${fx}px,${fy}px) rotateY(${sp}deg) rotateZ(${sp / 10}deg) scale(.45)`, opacity: 0 },
        { transform: `perspective(700px) translate(${fx * .2}px,${fy * .2}px) rotateY(${sp * .27}deg) rotateZ(${-sp / 25}deg) scale(.88)`, opacity: 1, offset: .45 },
        { transform: `perspective(700px) translateY(8px) rotateY(${-sp / 11}deg) rotateZ(${sp / 50}deg) scale(1.05)`, opacity: 1, offset: .75 },
        { transform: 'none', opacity: 1 },
      ], { at, dur: 1.1, ease: 'cubic-bezier(.25,.7,.3,1)' });
      const fAt = at + 1.1, fDur = (8 - fAt) / n;
      ctx.anim(ob + ' .pE3-obf', [{ transform: 'none' }, { transform: `translateY(${-amp}px) rotate(${k === 'bag' ? 0 : (amp % 2 ? 2 : -2)}deg)` }], { at: fAt, dur: fDur, iter: Infinity, dir: 'alternate', ease: 'ease-in-out' });
      const gAt = at + 1.3, gDur = (8 - gAt) / 2;
      ctx.anim(ob + ' .pE3-gl', [{ backgroundPosition: '130% 0', offset: 0 }, { backgroundPosition: '-30% 0', offset: .5 }, { backgroundPosition: '-30% 0', offset: 1 }], { at: gAt, dur: gDur, iter: Infinity, ease: 'cubic-bezier(.45,0,.35,1)' });
    });
    ctx.anim('.pE3-bsh', [{ transform: 'scale(.3)', opacity: 0 }, { transform: 'none', opacity: 1 }], { at: 1.7, dur: .8 });
    ctx.anim('.pE3-wgl', [{ backgroundPosition: '130% 0', offset: 0 }, { backgroundPosition: '-30% 0', offset: .5 }, { backgroundPosition: '-30% 0', offset: 1 }], { at: 2.0, dur: 3.0, iter: Infinity, ease: 'cubic-bezier(.45,0,.35,1)' });

    // ---- stars: pop with spin, float, twinkle ----
    const stars = [...root.querySelectorAll('.pE3-st')];
    stars.forEach((el, i) => {
      const at = 2.4 + i * .16;
      ctx.anim(el.querySelector('.pE3-stp'), [{ transform: 'scale(0) rotate(-120deg)', opacity: 0 }, { transform: 'scale(1.3) rotate(10deg)', opacity: 1, offset: .6 }, { transform: 'none', opacity: 1 }], { at, dur: .55 });
      const fAt = 3.0 + i * .1, fDur = (8 - fAt) / 4, amp = [12, 9, 7, 6][i];
      ctx.anim(el.querySelector('.pE3-stf'), [{ transform: 'none' }, { transform: `translateY(${-amp}px)` }], { at: fAt, dur: fDur, iter: Infinity, dir: 'alternate', ease: 'ease-in-out' });
      const tAt = 3.1 + i * .23, tDur = (8 - tAt) / 3;
      ctx.anim(el.querySelector('.pE3-stw'), [
        { transform: 'none', opacity: 1 }, { transform: 'scale(.45) rotate(20deg)', opacity: .35, offset: .18 },
        { transform: 'scale(1.18)', opacity: 1, offset: .32 }, { transform: 'none', opacity: 1, offset: .45 }, { transform: 'none', opacity: 1 },
      ], { at: tAt, dur: tDur, iter: Infinity, ease: 'ease-in-out' });
    });

    // ---- info panel flips up like a chrome screen (no swing — it is not a tag) ----
    ctx.anim('.pE3-info', [
      { transform: 'perspective(800px) translateY(60px) rotateX(-80deg)', opacity: 0 },
      { transform: 'perspective(800px) rotateX(8deg)', opacity: 1, offset: .65 },
      { transform: 'none', opacity: 1 },
    ], { at: 2.9, dur: .8, ease: 'cubic-bezier(.25,.7,.3,1)' });
    ctx.anim('.pE3-info > *', [{ opacity: 0, transform: 'translateX(-14px)' }, { opacity: 1, transform: 'none' }], { at: 3.35, dur: .3, stagger: .1 });

    // tagline bubble pops from the bag side
    ctx.anim('.pE3-bub', [
      { transform: 'translate(120px,10px) scale(.2) rotate(20deg)', opacity: 0 },
      { transform: 'scale(1.1)', opacity: 1, offset: .6 },
      { transform: 'scale(.97)', opacity: 1, offset: .8 },
      { transform: 'none', opacity: 1 },
    ], { at: 3.1, dur: .55, ease: 'cubic-bezier(.3,.6,.3,1)' });

    // QR compact flips open in 3D (flat at rest)
    ctx.anim('.pE3-qb', [{ transform: 'perspective(700px) rotateY(-95deg)', opacity: 0 }, { transform: 'perspective(700px) rotateY(10deg)', opacity: 1, offset: .65 }, { transform: 'none', opacity: 1 }], { at: 3.5, dur: .8 });
    ctx.anim('.pE3-qr', [{ opacity: 0, easing: S }, { opacity: .5, offset: .3, easing: S }, { opacity: 0, offset: .5, easing: S }, { opacity: 1, offset: .7 }, { opacity: 1 }], { at: 4.0, dur: .5, ease: 'linear' });

    ctx.anim('.pE3-foot', [{ transform: 'translateY(80px)' }, { transform: 'none' }], { at: 4.3, dur: .6 });
  },
};
</script>

<script>
window.__ready = (async () => {
  await document.fonts.ready;
  const m = mountPoster('E3', document.getElementById('cap'));
  await Promise.all([...document.querySelectorAll('#cap img')].map(i => i.decode ? i.decode().catch(() => {}) : 0));
  // 한글 폰트 조각(unicode-range)은 글자가 놓인 뒤에야 받기 시작한다 — 붙인 뒤 로딩이 끝날 때까지 기다린다
  for (let i = 0; i < 40; i++) {
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    await document.fonts.ready;
    if (document.fonts.status === 'loaded' && [...document.fonts].every(f => f.status !== 'loading')) break;
  }
  window.__T = m.T; window.__seek = t => m.seek(t);
  const q = new URLSearchParams(location.search);
  if (q.has('t')) m.seek(+q.get('t')); else if (!q.has('still')) {
    let t0 = performance.now(); const tick = now => { m.seek(((now - t0) / 1000) % m.T); requestAnimationFrame(tick); }; requestAnimationFrame(tick);
  }
  return true;
})();
