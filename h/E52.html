<script>// 포스터 시안 공용 키트 — 모든 안이 같은 문구·같은 시간축(seek)을 쓴다.
// 포스터 설계 크기: 700 x 980 (원본 포스터 5:7). 호스트가 transform으로 축소한다.
window.POSTERS = window.POSTERS || {};

// 원본 포스터(poster-original.jpeg) 문구 그대로. 안마다 빼지 말 것.
window.D = {
  edition: '제14회',
  purpose: '장학기금 마련과 불우이웃 돕기를 위한',
  title1: '천사데이',
  title2: '찬스바자회',
  dateLong: '2026년 10월 17일 (토)',
  dateShort: '10.17',
  year: '2026',
  weekday: '토',
  weekdayLong: '토요일',
  time: '오전 9시 30분 – 오후 5시',
  timeShort: '9:30 – 17:00',
  venue: '홀리씨즈교회',
  address: '서초구 동광로 8길 1',
  tagline: '기부 천사가 될 수 있는 단 하루!',
  welcome: 'WELCOME TO BAZAAR',
  contactLabel: '문의', contact: '02-593-0777',
  hostLabel: '주최·주관', host: '홀리씨즈교회 / HSS(홀리씨즈스쿨)',
  sponsorLabel: '후원', sponsor: '글로벌선교회, (사)세계청소년문화육성협회',
  // v3: hssbazaar.kr 'BAZAAR 2026 · 판매관과 라인업' 페이지의 판매관 이름 그대로 (가격·할인율은 넣지 않는다)
  booths: ['홀리파머스마켓', '홀리피셔마켓', '홀리플리마켓', '홀리약국', '아동용품관', '의류 및 악세사리관', '리빙관', '슈즈관', '푸드코트', '재능기부 마켓'],
};
// 오늘 기준 D-day (행사일 2026-10-17)
(() => {
  const now = (() => { try { const q = new URLSearchParams(parent.location.search).get('today'); if (q && /^\d{4}-\d{2}-\d{2}$/.test(q)) return new Date(q + 'T12:00:00'); } catch (e) {} return new Date(Date.now() + (new Date().getTimezoneOffset() + 540) * 6e4); })(); const ev = new Date(2026, 9, 17);
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const n = Math.round((ev - today) / 864e5);
  window.D.dday = n > 0 ? 'D-' + n : n === 0 ? 'D-DAY' : 'D+' + (-n);
})();

// 사용자 제공 QR(Linktree) 해독 주소 그대로 다시 만든 QR. 오류정정 Q, 37x37 모듈.
window.QR = { url: "https://linktr.ee/qr/87da1411-68b8-4bdd-a08f-fee0cb8254ef", rows: ["1111111001111101010001001101001111111", "1000001000101100100101001010001000001", "1011101010101100110011001001101011101", "1011101000100000101010011110101011101", "1011101011010111010100111111001011101", "1000001010100111001110100010101000001", "1111111010101010101010101010101111111", "0000000000101001000011110000000000000", "0100101011000001001001000011110110100", "1111000010011111000110111001000011010", "0001111100011101001011111111110001010", "0111000001111101010101110011110000100", "0010001001101100110111001001011000110", "1000000100111000100000110111110110100", "0111001011101100011011110111110011100", "1011110001011100010011101011000000111", "1100111100111111111000011000111001110", "0111100000100101100110010111010011000", "1100111111110101110101011011011110100", "0110000011000111001111111000010110100", "1001011000100101101011101001001000100", "0101010100001010101000110111000011000", "0000101010100010111101111011110001000", "1011110101111101011001011010101101100", "0111111101010001101011010011111001110", "1100110110000011101001111001000111000", "0011111100101010001111111011110100110", "0010100011100101100001110000101100100", "1111001110111111001011101000111110101", "0000000010110011100001010111100011000", "1111111000100100001000011010101011110", "1000001001100000110010110001100010111", "1011101011101100011000111000111111101", "1011101000011001001110010111001101010", "1011101000100111110010010010001100110", "1000001011111110100001111001010001110", "1111111000010100101111001010000100111"] };
// QR SVG 문자열. fg 짙은 색 / bg 밝은 색 (반전 금지 — 스캐너가 못 읽는 경우가 있다), quiet = 여백 모듈 수(최소 2).
window.qrSVG = (fg = '#111', bg = '#fff', quiet = 3) => {
  const R = window.QR.rows, n = R.length, N = n + quiet * 2; let d = '';
  R.forEach((row, y) => { for (let x = 0; x < n; x++) if (row[x] === '1') { let w = 1; while (x + w < n && row[x + w] === '1') w++; d += `M${x + quiet} ${y + quiet}h${w}v1h-${w}z`; x += w - 1; } });
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${N} ${N}" shape-rendering="crispEdges" role="img" aria-label="QR 코드"><rect width="${N}" height="${N}" fill="${bg}"/><path d="${d}" fill="${fg}"/></svg>`;
};

// 이름에 확장자가 없으면 v1 잘라 낸 레이어(assets/<name>.png), 있으면 assets/<경로> (예: 'A2/plate.webp'). 빌드 때 data URI로 바뀐다.
window.ASSET = name => (window.ASSETS && window.ASSETS[name]) || ('assets/' + (/\.\w+$/.test(name) ? name : name + '.png'));

// 결정적 난수 (seek 해도 같은 결과)
window.mulberry = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

// code 안의 포스터를 host 안에 붙이고 {T, seek} 를 돌려준다.
// build(root, ctx) 규약:
//   ctx.anim(target, keyframes, {at, dur, ease, iter, dir, stagger, composite})
//       target = 요소 | root 기준 선택자. at·dur·stagger 는 초. fill 은 'both' 고정.
//       기본 상태(CSS)는 '완성된 포스터'. 키프레임은 숨은 상태에서 시작해 완성 상태로 끝나게.
//   ctx.onSeek(fn(t))  — JS로 그리는 효과(글자 섞기, 캔버스)용. t 초.
//   ctx.D, ctx.asset(name), ctx.rand(seed)
window.mountPoster = function (code, host) {
  const P = POSTERS[code];
  const tpl = document.getElementById('tpl-' + code);
  host.appendChild(tpl.content.cloneNode(true));
  const root = host.querySelector('.p' + code);
  const anims = [], seekFns = [];
  const ctx = {
    D: window.D, asset: window.ASSET, rand: window.mulberry,
    anim(target, kf, o = {}) {
      const els = typeof target === 'string' ? [...root.querySelectorAll(target)] : (target instanceof Element ? [target] : [...target]);
      els.forEach((el, i) => {
        const a = el.animate(kf, {
          duration: (o.dur ?? 0.6) * 1000, delay: ((o.at ?? 0) + i * (o.stagger ?? 0)) * 1000,
          easing: o.ease ?? 'cubic-bezier(.2,.8,.2,1)', iterations: o.iter ?? 1, direction: o.dir ?? 'normal',
          fill: 'both', composite: o.composite ?? 'replace',
        });
        a.pause(); anims.push(a);
      });
    },
    onSeek(fn) { seekFns.push(fn); },
  };
  P.build(root, ctx);
  const seek = t => { const ms = t * 1000; for (const a of anims) a.currentTime = ms; for (const f of seekFns) f(t); };
  seek(P.T);
  return { T: P.T, seek, root, name: P.name };
};
// v4: 홀리피셔마켓은 올해 열리지 않을 수 있어 뺀 목록. v4 포스터는 이것을 **이름으로** 고른다(인덱스 금지 — v3 는 booths 인덱스를 씀).
window.D.booths4 = window.D.booths.filter(b => b !== '홀리피셔마켓');
</script>

<script>
POSTERS.E52 = {
  name: '창이 열리는 데스크톱',
  T: 8,
  build(root, ctx) {
    const D = ctx.D, B = D.booths4;
    root.querySelectorAll('[data-k]').forEach(el => { el.textContent = D[el.dataset.k]; });
    const img = {
      skewers: ctx.asset('E4/skewers.webp'),
      bag: ctx.asset('E4/bag.webp'),
      bracelets: ctx.asset('E4/bracelets.webp'),
      oranges: ctx.asset('E4/oranges.webp'),
    };
    // 창 제목줄 = 판매관 이름 (booths4 에서 이름으로 찾음). 목록에 없으면 그 창은 숨김.
    root.querySelectorAll('.pE52-bw').forEach(w => {
      const name = B.find(b => b === w.dataset.booth);
      if (!name) { w.style.display = 'none'; return; }
      w.querySelector('.pE52-tt').textContent = name;
      w.querySelector('.pE52-ph img').src = img[w.dataset.img];
    });
    root.querySelector('.pE52-s-ribbon img').src = ctx.asset('E4/ribbon.webp');
    root.querySelector('.pE52-s-rose img').src = ctx.asset('E4/rose.webp');
    const star = ctx.asset('E4/star.webp');
    root.querySelectorAll('.pE52-s-star img').forEach(i => { i.src = star; });
    root.querySelector('.pE52-qr').innerHTML = qrSVG('#1f1a45', '#ffffff', 3);

    // tagline in the menu bar
    const bar = document.createElement('div');
    bar.className = 'pE52-bar';
    bar.innerHTML = '<div class="pE52-logo"><img alt=""></div><div class="pE52-ed"></div><div class="pE52-tag"><span></span><b></b></div><div class="pE52-dd"><svg viewBox="0 0 22 20"><path d="M11 19 C4 14 1 10.5 1 6.5 C1 3.4 3.4 1 6.3 1 C8.4 1 10.2 2.3 11 4 C11.8 2.3 13.6 1 15.7 1 C18.6 1 21 3.4 21 6.5 C21 10.5 18 14 11 19Z" fill="#ff5fa8" stroke="#1f1a45" stroke-width="2"/></svg><span></span></div>';
    root.querySelector('.pE52-main').before(bar);
    bar.querySelector('.pE52-logo img').src = ctx.asset('E4/wings.webp');
    bar.querySelector('.pE52-ed').textContent = D.edition;
    const tl = D.tagline, cut = tl.indexOf('단 하루');
    bar.querySelector('.pE52-tag span').textContent = tl.slice(0, cut);
    bar.querySelector('.pE52-tag b').textContent = tl.slice(cut);
    bar.querySelector('.pE52-dd span').textContent = D.dday;

    // ---- timeline: cursor clicks open each window from the click point ----
    const box = el => ({ l: el.offsetLeft, t: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight });
    const wins = [
      ['.pE52-main', 1.0, [350, 210]],
      ['.pE52-w1', 2.05, [180, 440]],
      ['.pE52-w2', 2.45, [520, 430]],
      ['.pE52-w3', 2.85, [190, 610]],
      ['.pE52-w4', 3.25, [510, 600]],
      ['.pE52-info', 3.75, [240, 800]],
      ['.pE52-qw', 4.25, [581, 803]],
    ];
    // cursor path: arrive, click each window spot, then rest on an empty bit of desktop
    const path = [{ t: 0, x: 760, y: 1000 }, { t: .85, x: 350, y: 210 }];
    wins.slice(1).forEach(([, at, [x, y]]) => path.push({ t: at - .2, x, y }));
    path.push({ t: 5.2, x: 652, y: 640 });
    const T0 = path[path.length - 1].t;
    ctx.anim('.pE52-cur', path.map(p => ({ transform: `translate(${p.x}px,${p.y}px)`, offset: p.t / T0, easing: 'cubic-bezier(.45,0,.25,1)' })), { at: 0, dur: T0, ease: 'linear' });
    ctx.anim('.pE52-cur svg', [{ transform: 'none' }, { transform: 'translate(2px,-3px) rotate(-6deg)' }], { at: 5.4, dur: .65, iter: Infinity, dir: 'alternate', ease: 'ease-in-out' });

    const fx = root.querySelector('.pE52-fx');
    const mk = (cls, css) => { const d = document.createElement('div'); d.className = cls; Object.assign(d.style, css); fx.appendChild(d); return d; };
    wins.forEach(([sel, at, [cx, cy]], i) => {
      const el = root.querySelector(sel);
      if (!el || el.style.display === 'none') return;
      const b = box(el);
      el.style.transformOrigin = `${cx - b.l}px ${cy - b.t}px`;
      const clk = mk('pE52-clk', { left: cx + 'px', top: cy + 'px' });
      ctx.anim(clk, [{ opacity: 0, transform: 'scale(.3)' }, { opacity: 1, transform: 'scale(.7)', offset: .3 }, { opacity: 0, transform: 'scale(1.5)' }], { at: at - .12, dur: .35, ease: 'ease-out' });
      ctx.anim(el, [
        { transform: 'scale(.04)', opacity: 0 },
        { transform: 'scale(.04)', opacity: 1, offset: .05 },
        { transform: 'scale(1.04)', opacity: 1, offset: .7 },
        { transform: 'none', opacity: 1 },
      ], { at, dur: .5, ease: 'cubic-bezier(.3,.8,.3,1)' });
      // classic zoom outlines expanding from the click to the window frame
      for (let k = 0; k < 3; k++) {
        const z = mk('pE52-zoom', {});
        ctx.anim(z, [
          { left: cx + 'px', top: cy + 'px', width: '0px', height: '0px', opacity: 0 },
          { opacity: .9, offset: .2 },
          { left: b.l + 'px', top: b.t + 'px', width: b.w + 'px', height: b.h + 'px', opacity: 0 },
        ], { at: at - .25 + k * .07, dur: .4, ease: 'cubic-bezier(.3,.7,.4,1)' });
      }
    });
    // window contents appear after their frame
    ctx.anim('.pE52-pur', [{ opacity: 0, transform: 'translateY(-10px)' }, { opacity: 1, transform: 'none' }], { at: 1.4, dur: .35 });
    const S = 'steps(1,end)';
    ['.pE52-t1', '.pE52-t2'].forEach((s, i) => {
      ctx.anim(s, [
        { opacity: 0, transform: 'translateX(0)', easing: S },
        { opacity: 1, transform: 'translateX(-10px)', offset: .2, easing: S },
        { opacity: .4, transform: 'translateX(8px)', offset: .4, easing: S },
        { opacity: 1, transform: 'translateX(-4px)', offset: .6, easing: S },
        { opacity: 1, transform: 'none' },
      ], { at: 1.45 + i * .25, dur: .5, ease: 'linear' });
    });
    ctx.anim('.pE52-shine', [{ backgroundPosition: '130% 0', offset: 0 }, { backgroundPosition: '-30% 0', offset: .5 }, { backgroundPosition: '-30% 0', offset: 1 }], { at: 3.0, dur: 2.5, iter: Infinity, stagger: .25, ease: 'cubic-bezier(.45,0,.35,1)' });
    // photos "load" top to bottom inside each booth window
    wins.slice(1, 5).forEach(([sel, at]) => {
      ctx.anim(sel + ' .pE52-ph', [{ clipPath: 'inset(0 0 100% 0)' }, { clipPath: 'inset(0 0 0 0)' }], { at: at + .35, dur: .45, ease: 'steps(6,end)' });
    });
    ctx.anim('.pE52-ib > *', [{ opacity: 0, transform: 'translateX(-12px)' }, { opacity: 1, transform: 'none' }], { at: 4.15, dur: .3, stagger: .1 });
    ctx.anim('.pE52-qr', [{ opacity: 0, easing: S }, { opacity: .5, offset: .3, easing: S }, { opacity: 0, offset: .5, easing: S }, { opacity: 1, offset: .7 }, { opacity: 1 }], { at: 4.65, dur: .45, ease: 'linear' });

    // menu bar + taskbar slide in, desktop fades up
    ctx.anim('.pE52-dots', [{ opacity: 0 }, { opacity: 1 }], { at: 0, dur: .8 });
    ctx.anim(bar, [{ transform: 'translateY(-52px)' }, { transform: 'none' }], { at: .2, dur: .45 });
    ctx.anim('.pE52-foot', [{ transform: 'translateY(76px)' }, { transform: 'none' }], { at: .35, dur: .45 });

    // stickers slap on at the end, then float
    const sk = [...root.querySelectorAll('.pE52-sk')];
    sk.forEach((el, i) => {
      const at = 4.7 + i * .15;
      ctx.anim(el.querySelector('.pE52-skp'), [{ transform: 'scale(1.8) rotate(-25deg)', opacity: 0 }, { transform: 'scale(.92) rotate(4deg)', opacity: 1, offset: .6 }, { transform: 'none', opacity: 1 }], { at, dur: .45, ease: 'cubic-bezier(.3,.7,.3,1)' });
      const fAt = at + .5, n = 4, fDur = (8 - fAt) / n;
      ctx.anim(el.querySelector('.pE52-skf'), [{ transform: 'none' }, { transform: `translateY(${-[6, 5, 7, 5][i]}px) rotate(${i % 2 ? 3 : -3}deg)` }], { at: fAt, dur: fDur, iter: Infinity, dir: 'alternate', ease: 'ease-in-out' });
    });
  },
};
</script>

<script>
window.__ready = (async () => {
  await document.fonts.ready;
  const m = mountPoster('E52', document.getElementById('cap'));
  await Promise.all([...document.querySelectorAll('#cap img')].map(i => i.decode ? i.decode().catch(() => {}) : 0));
  // 한글 폰트 조각(unicode-range)은 글자가 놓인 뒤에야 받기 시작한다 — 붙인 뒤 로딩이 끝날 때까지 기다린다
  for (let i = 0; i < 40; i++) {
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    await document.fonts.ready;
    if (document.fonts.status === 'loaded' && [...document.fonts].every(f => f.status !== 'loading')) break;
  }
  window.__T = m.T; window.__seek = t => m.seek(t);
  const q = new URLSearchParams(location.search);
  if (q.has('t')) m.seek(+q.get('t')); else if (!q.has('still')) {
    let t0 = performance.now(); const tick = now => { m.seek(((now - t0) / 1000) % m.T); requestAnimationFrame(tick); }; requestAnimationFrame(tick);
  }
  return true;
})();
</script></body></html>
